name: Auto Merge Jaibhagwan PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jaibhagwan-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ALLOWED_COLLABORATOR: jaibhagwanjindal

jobs:
  auto-merge:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secret
        env:
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
        run: |
          if [ -z "$OWNER_TOKEN" ]; then
            echo "OWNER_TOKEN secret is missing."
            exit 1
          fi

      - name: Validate owner token identity
        id: owner_identity
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OWNER_TOKEN }}
          script: |
            const viewer = await github.graphql(`query { viewer { login } }`);
            const tokenLogin = viewer.viewer.login;
            const tokenLoginLower = tokenLogin.toLowerCase();
            const repoOwnerLower = context.repo.owner.toLowerCase();

            if (tokenLoginLower !== repoOwnerLower) {
              core.setFailed(`OWNER_TOKEN belongs to @${tokenLogin}, but repository owner is @${context.repo.owner}.`);
              return;
            }
            core.setOutput('owner_login', tokenLogin);

      - name: Allow only Jaibhagwan-sourced changes
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.payload.pull_request.user.login.toLowerCase();
            const allowed = process.env.ALLOWED_COLLABORATOR.toLowerCase();
            if (actor !== allowed) {
              core.setFailed(`PR actor @${actor} is not the allowed collaborator @${allowed}.`);
            }

      - name: Auto-approve PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OWNER_TOKEN }}
          script: |
            const pullNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: pullNumber,
              event: 'APPROVE',
              body: 'Auto-approved for owner-authored merge.'
            });

      - name: Retry direct owner merge until ready
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OWNER_TOKEN }}
          script: |
            const pullNumber = context.payload.pull_request.number;
            const ownerLogin = `${{ steps.owner_identity.outputs.owner_login }}`;
            const { owner, repo } = context.repo;
            const deadlineMs = Date.now() + 8 * 60 * 1000; // 8 minute timeout
            const waitMs = 15000; // 15 second interval

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            while (Date.now() < deadlineMs) {
              try {
                // We use REST API merge here instead of GraphQL enablePullRequestAutoMerge.
                // This bypasses the 'verified email' bug while still being an owner-authored commit.
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pullNumber,
                  merge_method: 'merge', // Using 'merge' to preserve your contribution history (green squares)
                  commit_title: `Merge PR #${pullNumber}: ${context.payload.pull_request.title}`,
                  commit_message: `Auto-merged by owner @${ownerLogin} to trigger Vercel build.`
                });

                core.notice(`Successfully merged as owner @${ownerLogin}.`);
                return;
              } catch (error) {
                const message = String(error.message || error);
                const status = Number(error.status || 0);

                // 405 (Not Mergeable), 409 (Conflict), or 422 (Unprocessable) usually mean checks are still running
                if ([405, 409, 422].includes(status)) {
                  core.notice(`Merge not ready yet (status ${status}). Waiting for checks...`);
                  await sleep(waitMs);
                  continue;
                }

                core.setFailed(`Non-retryable merge error: ${message}`);
                return;
              }
            }

            core.setFailed('Timeout: PR did not become mergeable within 8 minutes.');