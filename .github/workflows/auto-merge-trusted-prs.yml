name: Auto Merge Jaibhagwan PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jaibhagwan-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ALLOWED_COLLABORATOR: jaibhagwanjindal

jobs:
  auto-merge:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secret
        env:
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
        run: |
          if [ -z "$OWNER_TOKEN" ]; then
            echo "OWNER_TOKEN secret is missing."
            exit 1
          fi

      - name: Allow only JaibhagwanJindal PR author
        id: author_gate
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OWNER_TOKEN }}
          script: |
            const allowed = process.env.ALLOWED_COLLABORATOR;
            const author = context.payload.pull_request.user.login.toLowerCase();

            if (author !== allowed) {
              core.notice(`Skipping PR author @${author}. Only @${allowed} is allowed.`);
              core.setOutput('allowed', 'false');
              return;
            }

            core.notice(`PR author @${author} is allowed.`);
            core.setOutput('allowed', 'true');

      - name: Auto-approve PR
        if: steps.author_gate.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OWNER_TOKEN }}
          script: |
            const pull_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number,
                event: 'APPROVE',
                body: 'Auto-approved for trusted collaborator.'
              });
            } catch (error) {
              const message = String(error.message || error);
              if (
                message.includes('Cannot approve your own pull request') ||
                message.includes('Review comments is invalid')
              ) {
                core.notice(`Approval skipped: ${message}`);
                return;
              }
              throw error;
            }

      - name: Try instant merge (squash)
        id: merge_now
        if: steps.author_gate.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OWNER_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            try {
              const result = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number,
                merge_method: 'squash',
                commit_title: `Merge PR #${pull_number}: ${context.payload.pull_request.title}`
              });

              core.notice(`Merged immediately. SHA: ${result.data.sha}`);
              core.setOutput('merged', 'true');
            } catch (error) {
              const message = String(error.message || error);
              core.notice(`Immediate merge not possible yet: ${message}`);
              core.setOutput('merged', 'false');
            }

      - name: Enable auto-merge fallback
        if: steps.author_gate.outputs.allowed == 'true' && steps.merge_now.outputs.merged != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OWNER_TOKEN }}
          script: |
            const pullRequestId = context.payload.pull_request.node_id;

            try {
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                    pullRequest { number }
                  }
                }`,
                { pullRequestId }
              );
            } catch (error) {
              const message = String(error.message || error);
              if (
                message.includes('already enabled') ||
                message.includes('Auto merge is disabled') ||
                message.includes('is not mergeable') ||
                message.includes('At least 1 approving review is required') ||
                message.includes('Could not resolve to a PullRequest')
              ) {
                core.notice(`Auto-merge not enabled yet: ${message}`);
                return;
              }
              throw error;
            }