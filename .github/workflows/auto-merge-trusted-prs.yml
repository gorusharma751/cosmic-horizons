name: Auto Merge Jaibhagwan PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jaibhagwan-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ALLOWED_COLLABORATOR: jaibhagwanjindal

jobs:
  auto-merge:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secret
        env:
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
        run: |
          if [ -z "$OWNER_TOKEN" ]; then
            echo "OWNER_TOKEN secret is missing."
            exit 1
          fi

      - name: Validate owner token identity
        id: owner_identity
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OWNER_TOKEN }}
          script: |
            const viewer = await github.graphql(`query { viewer { login databaseId } }`);
            const tokenLogin = viewer.viewer.login;
            const tokenLoginLower = tokenLogin.toLowerCase();
            const repoOwnerLower = context.repo.owner.toLowerCase();

            if (tokenLoginLower !== repoOwnerLower) {
              core.setFailed(
                `OWNER_TOKEN belongs to @${tokenLogin}, but repo owner is @${context.repo.owner}. ` +
                'Use Gourav owner token in OWNER_TOKEN secret.'
              );
              return;
            }

            const ownerNoreply = `${viewer.viewer.databaseId}+${tokenLogin}@users.noreply.github.com`;
            core.notice(`Using owner identity @${tokenLogin}.`);
            core.setOutput('owner_login', tokenLogin);
            core.setOutput('owner_email', ownerNoreply);

      - name: Allow only Jaibhagwan-sourced changes
        id: author_gate
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OWNER_TOKEN }}
          script: |
            const allowed = process.env.ALLOWED_COLLABORATOR;
            const author = context.payload.pull_request.user.login.toLowerCase();

            if (author === allowed) {
              core.notice(`PR author @${author} is allowed.`);
              core.setOutput('allowed', 'true');
              return;
            }

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number,
              per_page: 100
            });

            if (commits.length === 0) {
              core.notice('No commits found in PR. Skipping.');
              core.setOutput('allowed', 'false');
              return;
            }

            const isCommitFromAllowedUser = (commitItem) => {
              const authorLogin = commitItem.author?.login?.toLowerCase() || '';
              const committerLogin = commitItem.committer?.login?.toLowerCase() || '';
              return authorLogin === allowed || committerLogin === allowed;
            };

            const hasNonAllowedCommit = commits.some((commitItem) => !isCommitFromAllowedUser(commitItem));
            if (hasNonAllowedCommit) {
              core.notice(
                `PR author is @${author} and at least one commit is not from @${allowed}. Skipping.`
              );
              core.setOutput('allowed', 'false');
              return;
            }

            core.notice(
              `PR author is @${author}, but all commits are from @${allowed}. Allowing auto-merge.`
            );
            core.setOutput('allowed', 'true');

      - name: Auto-approve PR
        if: steps.author_gate.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OWNER_TOKEN }}
          script: |
            const pull_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number,
                event: 'APPROVE',
                body: 'Auto-approved for trusted collaborator.'
              });
            } catch (error) {
              const message = String(error.message || error);
              if (
                message.includes('Cannot approve your own pull request') ||
                message.includes('Review comments is invalid')
              ) {
                core.notice(`Approval skipped: ${message}`);
                return;
              }
              throw error;
            }

      - name: Try instant owner-authored merge (squash)
        id: merge_now
        if: steps.author_gate.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OWNER_TOKEN }}
          script: |
            const pullRequestId = context.payload.pull_request.node_id;
            const pullNumber = context.payload.pull_request.number;
            const ownerEmail = `${{ steps.owner_identity.outputs.owner_email }}`;
            const ownerLogin = `${{ steps.owner_identity.outputs.owner_login }}`;
            const headline = `Merge PR #${pullNumber}: ${context.payload.pull_request.title}`;
            const body = `Auto-merged by owner @${ownerLogin}.`;

            try {
              await github.graphql(
                `mutation($pullRequestId: ID!, $authorEmail: String!, $headline: String!, $body: String!) {
                  mergePullRequest(
                    input: {
                      pullRequestId: $pullRequestId,
                      mergeMethod: SQUASH,
                      authorEmail: $authorEmail,
                      commitHeadline: $headline,
                      commitBody: $body
                    }
                  ) {
                    pullRequest {
                      number
                    }
                  }
                }`,
                {
                  pullRequestId,
                  authorEmail: ownerEmail,
                  headline,
                  body
                }
              );

              core.notice(`Merged immediately as owner @${ownerLogin}.`);
              core.setOutput('merged', 'true');
            } catch (error) {
              const message = String(error.message || error);
              core.notice(`Immediate merge not possible yet: ${message}`);
              core.setOutput('merged', 'false');
            }

      - name: Enable auto-merge fallback
        if: steps.author_gate.outputs.allowed == 'true' && steps.merge_now.outputs.merged != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OWNER_TOKEN }}
          script: |
            const pullRequestId = context.payload.pull_request.node_id;
            const pullNumber = context.payload.pull_request.number;
            const ownerEmail = `${{ steps.owner_identity.outputs.owner_email }}`;
            const ownerLogin = `${{ steps.owner_identity.outputs.owner_login }}`;

            try {
              await github.graphql(
                `mutation($pullRequestId: ID!, $authorEmail: String!, $headline: String!, $body: String!) {
                  enablePullRequestAutoMerge(
                    input: {
                      pullRequestId: $pullRequestId,
                      mergeMethod: SQUASH,
                      authorEmail: $authorEmail,
                      commitHeadline: $headline,
                      commitBody: $body
                    }
                  ) {
                    pullRequest { number }
                  }
                }`,
                {
                  pullRequestId,
                  authorEmail: ownerEmail,
                  headline: `Merge PR #${pullNumber}: ${context.payload.pull_request.title}`,
                  body: `Auto-merged by owner @${ownerLogin}.`
                }
              );
            } catch (error) {
              const message = String(error.message || error);
              if (
                message.includes('already enabled') ||
                message.includes('Auto merge is disabled') ||
                message.includes('is not mergeable') ||
                message.includes('At least 1 approving review is required') ||
                message.includes('Could not resolve to a PullRequest')
              ) {
                core.notice(`Auto-merge not enabled yet: ${message}`);
                return;
              }
              throw error;
            }