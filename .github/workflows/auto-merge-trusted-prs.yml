name: Auto Merge Trusted PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trusted-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secret
        env:
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
        run: |
          if [ -z "$OWNER_TOKEN" ]; then
            echo "OWNER_TOKEN secret is missing."
            exit 1
          fi

      - name: Check whether PR author is trusted
        id: trust
        uses: actions/github-script@v7
        env:
          TRUSTED_COLLABORATORS: ${{ secrets.TRUSTED_COLLABORATORS }}
        with:
          github-token: ${{ secrets.OWNER_TOKEN }}
          script: |
            const trusted = new Set();

            const fromSecret = (process.env.TRUSTED_COLLABORATORS || '')
              .split(',')
              .map((name) => name.trim().toLowerCase())
              .filter(Boolean);
            for (const login of fromSecret) {
              trusted.add(login);
            }

            try {
              const file = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.github/trusted-collaborators.txt',
                ref: context.payload.pull_request.base.ref
              });

              if ('content' in file.data) {
                const decoded = Buffer.from(file.data.content, 'base64').toString('utf8');
                for (const line of decoded.split(/\r?\n/)) {
                  const value = line.trim().toLowerCase();
                  if (!value || value.startsWith('#')) {
                    continue;
                  }
                  trusted.add(value);
                }
              }
            } catch (error) {
              core.warning(`Could not load .github/trusted-collaborators.txt: ${error.message}`);
            }

            const author = context.payload.pull_request.user.login.toLowerCase();

            if (trusted.size === 0) {
              core.notice('No trusted collaborators configured. Skipping.');
              core.setOutput('trusted', 'false');
              return;
            }

            if (!trusted.has(author)) {
              core.notice(`@${author} is not trusted. Skipping.`);
              core.setOutput('trusted', 'false');
              return;
            }

            core.notice(`@${author} is trusted.`);
            core.setOutput('trusted', 'true');

      - name: Auto-approve trusted PR
        if: steps.trust.outputs.trusted == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OWNER_TOKEN }}
          script: |
            const pull_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number,
                event: 'APPROVE',
                body: 'Auto-approved for trusted collaborator.'
              });
            } catch (error) {
              const message = String(error.message || error);
              if (
                message.includes('Cannot approve your own pull request') ||
                message.includes('Review comments is invalid')
              ) {
                core.notice(`Approval skipped: ${message}`);
                return;
              }
              throw error;
            }

      - name: Enable auto-merge (squash)
        if: steps.trust.outputs.trusted == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OWNER_TOKEN }}
          script: |
            const pullRequestId = context.payload.pull_request.node_id;

            try {
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                    pullRequest { number }
                  }
                }`,
                { pullRequestId }
              );
            } catch (error) {
              const message = String(error.message || error);
              if (
                message.includes('already enabled') ||
                message.includes('Auto merge is disabled') ||
                message.includes('is not mergeable') ||
                message.includes('At least 1 approving review is required')
              ) {
                core.notice(`Auto-merge not enabled yet: ${message}`);
                return;
              }
              throw error;
            }